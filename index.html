  <!-- React Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Web Audio Chime Generator
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && window.AudioContext) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playCheckin() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.exponentialRampToValueAtTime(783.99, now + 0.12);
          gain.gain.setValueAtTime(0.18, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now);
          osc.stop(now + 0.35);
        } catch(e) {}
      }
      playMilestone() {
        if (!this.enabled) return;
        try {
          this.init();
          if (!this.ctx) return;
          if (this.ctx.state === 'suspended') this.ctx.resume();
          const now = this.ctx.currentTime;
          [440, 554.37, 659.25, 880].forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.08);
            gain.gain.setValueAtTime(0.16, now + idx * 0.08);
            gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.4);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + idx * 0.08);
            osc.stop(now + idx * 0.08 + 0.4);
          });
        } catch(e) {}
      }
    }
    const sound = new SoundEngine();

    // Motivational quotes
    const motivationalQuotes = [
      { text: "We are what we repeatedly do. Excellence, then, is not an act, but a habit.", author: "Will Durant" },
      { text: "You do not rise to the level of your goals. You fall to the level of your systems.", author: "James Clear" },
      { text: "Small daily improvements over time lead to stunning results.", author: "Robin Sharma" },
      { text: "At first we make our habits, then our habits make us.", author: "John Dryden" },
      { text: "The impediment to action advances action. What stands in the way becomes the way.", author: "Marcus Aurelius" }
    ];

    // Initial Default Challenge Seeds (Matching user screenshot)
    const initialSeedChallenges = [
      {
        _id: 'seed_workout_1',
        title: '30-Day Workout & Strength Sprint',
        category: 'Fitness & Health',
        schedule: 'Daily 7:00 AM',
        description: 'Non-negotiable daily training, 20 push-ups, 3km evening walk, and clean nutrition tracking.',
        streak: 12,
        days: Array.from({ length: 30 }, (_, i) => {
          const d = i + 1;
          let status = 'pending';
          let note = '';
          let mood = null;
          if (d <= 11) { status = 'completed'; mood = 5; }
          else if (d === 12 || d === 13) { status = 'completed'; mood = 4; note = 'Partial recovery session'; }
          else if (d === 14) { status = 'pending'; note = 'Today: 20 push-ups & 3km walk'; }
          return { dayNumber: d, status, note, mood };
        }),
        habits: [
          { id: 'h1', text: '45-min Morning Strength Training', completed: true },
          { id: 'h2', text: 'Drink 3L Water + Electrolytes', completed: true },
          { id: 'h3', text: '20 Push-ups & 3km Evening Walk', completed: false }
        ]
      },
      {
        _id: 'seed_deepwork_2',
        title: '30 Days Morning Deep Work',
        category: 'Productivity',
        schedule: 'Daily 9:00 AM',
        description: 'Zero distractions before 11 AM. 90-min hard problem focus and clean GitHub commits.',
        streak: 8,
        days: Array.from({ length: 30 }, (_, i) => ({
          dayNumber: i + 1,
          status: i < 8 ? 'completed' : 'pending',
          note: '',
          mood: i < 8 ? 5 : null
        })),
        habits: [
          { id: 'dw1', text: 'Focus Block: 90 mins Deep Coding', completed: true },
          { id: 'dw2', text: 'Push 1 verified GitHub commit', completed: true },
          { id: 'dw3', text: 'Read 1 Technical RFC / Paper (Pending)', completed: false }
        ]
      }
    ];

    function App() {
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('daybyday_auth_user');
        return saved ? JSON.parse(saved) : null;
      });
      const [isProfileOpen, setIsProfileOpen] = useState(false);
      const [authMode, setAuthMode] = useState('signin'); // 'signin' or 'signup'
      const [authName, setAuthName] = useState('');
      const [authEmail, setAuthEmail] = useState('');
      const [authPassword, setAuthPassword] = useState('');
      const [showAuthPassword, setShowAuthPassword] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');
      const [challenges, setChallenges] = useState(() => {
        const saved = localStorage.getItem('daybyday_standalone_data_v2');
        return saved ? JSON.parse(saved) : initialSeedChallenges;
      });
      const [activeChallengeId, setActiveChallengeId] = useState(() => challenges[0]._id);
      const [activeTab, setActiveTab] = useState('dashboard'); // default to Dashboard (Home) as in Stitch screen 1db983cbf4a04fed9d28b3c01ac0ef92
      const [searchQuery, setSearchQuery] = useState('');
      const [selectedCategory, setSelectedCategory] = useState('All');
      const [activeFilterTab, setActiveFilterTab] = useState('all');

      // Deep Work Checklist toggle state
      const [deepWorkTasks, setDeepWorkTasks] = useState([
        { id: 'dw1', text: 'Focus Block: 90 mins Deep Coding', done: true },
        { id: 'dw2', text: 'Push 1 verified GitHub commit', done: true },
        { id: 'dw3', text: 'Read 1 Technical RFC / Paper (Pending)', done: false }
      ]);

      const toggleDeepWork = (id) => {
        setDeepWorkTasks(prev => prev.map(t => t.id === id ? { ...t, done: !t.done } : t));
        sound.playCheckin();
      };
      const [isDark, setIsDark] = useState(true);
      const [quoteIndex, setQuoteIndex] = useState(0);

      // Modals
      const [dayModal, setDayModal] = useState(null); // active day object
      const [isNewModalOpen, setIsNewModalOpen] = useState(false);
      const [celebrationData, setCelebrationData] = useState(null);
      const [isShareModalOpen, setIsShareModalOpen] = useState(false);

      const activeChallenge = challenges.find(c => c._id === activeChallengeId) || challenges[0];

      useEffect(() => {
        localStorage.setItem('daybyday_standalone_data', JSON.stringify(challenges));
      }, [challenges]);

      // Metrics calculation
      const completedCount = activeChallenge.days.filter(d => d.status === 'completed').length;
      const successRate = Math.round((completedCount / 30) * 100);
      const remainingDays = 30 - completedCount;
      const firstPending = activeChallenge.days.find(d => d.status === 'pending');
      const activeDayNumber = firstPending ? firstPending.dayNumber : 30;

      // Toggle Day status
      const handleToggleDay = (dayNumber) => {
        const target = activeChallenge.days.find(d => d.dayNumber === dayNumber);
        if (!target) return;
        let nextStatus = 'completed';
        if (target.status === 'pending') nextStatus = 'completed';
        else if (target.status === 'completed') nextStatus = 'missed';
        else if (target.status === 'missed') nextStatus = 'pending';

        if (nextStatus === 'completed') sound.playCheckin();

        const updatedDays = activeChallenge.days.map(d => {
          if (d.dayNumber === dayNumber) return { ...d, status: nextStatus };
          return d;
        });

        // Recalculate streak
        let streak = 0;
        for (const d of updatedDays) {
          if (d.status === 'completed') streak++;
          else if (d.status === 'missed') streak = 0;
          else break;
        }

        const updatedChallenge = { ...activeChallenge, days: updatedDays, streak };
        setChallenges(challenges.map(c => c._id === activeChallenge._id ? updatedChallenge : c));

        // Milestone trigger
        const newTotal = updatedDays.filter(d => d.status === 'completed').length;
        if ([7, 14, 21, 30].includes(newTotal) && nextStatus === 'completed') {
          sound.playMilestone();
          if (window.confetti) {
            window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
          }
          setCelebrationData({ milestone: newTotal, streak, rate: Math.round((newTotal / 30) * 100) });
        }
      };

      // Save reflection note
      const handleSaveDayNote = (dayNum, status, note, mood) => {
        const updatedDays = activeChallenge.days.map(d => {
          if (d.dayNumber === dayNum) return { ...d, status, note, mood };
          return d;
        });
        const updatedChallenge = { ...activeChallenge, days: updatedDays };
        setChallenges(challenges.map(c => c._id === activeChallenge._id ? updatedChallenge : c));
        setDayModal(null);
      };

      // Toggle habit
      const handleToggleHabit = (id) => {
        sound.playCheckin();
        const updated = activeChallenge.habits.map(h => h.id === id ? { ...h, completed: !h.completed } : h);
        const updatedChallenge = { ...activeChallenge, habits: updated };
        setChallenges(challenges.map(c => c._id === activeChallenge._id ? updatedChallenge : c));
      };

      // Add habit
      const handleAddHabit = (text) => {
        if (!text.trim()) return;
        const newH = { id: 'h_' + Date.now(), text: text.trim(), completed: false };
        const updatedChallenge = { ...activeChallenge, habits: [...activeChallenge.habits, newH] };
        setChallenges(challenges.map(c => c._id === activeChallenge._id ? updatedChallenge : c));
      };

      // Create challenge
      const handleCreateChallenge = (title, category, description, habits) => {
        const newC = {
          _id: 'c_' + Date.now(),
          title,
          category,
          description,
          streak: 0,
          days: Array.from({ length: 30 }, (_, i) => ({
            dayNumber: i + 1,
            status: 'pending',
            note: '',
            mood: null
          })),
          habits: habits.length > 0
            ? habits.map((text, idx) => ({ id: 'h_' + idx, text, completed: false }))
            : [{ id: 'h1', text: '45-min daily focus sprint', completed: false }]
        };
        setChallenges([newC, ...challenges]);
        setActiveChallengeId(newC._id);
        setIsNewModalOpen(false);
        sound.playMilestone();
      };

      const navItems = [
        { id: 'dashboard', label: 'Dashboard (Home)', icon: '📊' },
        { id: 'today', label: "Today's Tasks", icon: '✓' },
        { id: 'calendar', label: '30-Day Calendar', icon: '📅' },
        { id: 'analytics', label: 'Progress & Analytics', icon: '📈' },
        { id: 'challenges', label: 'My Challenges', icon: '🎯' },
        { id: 'completion', label: 'Challenge Completion', icon: '🏆' },
        { id: 'settings', label: 'Settings', icon: '⚙️' }
      ];

      const handleEnroll = (title) => {
        handleCreateChallenge(title, 'Curated Template', '30-Day transformation blueprint.', ['Daily execution', 'Hydration', 'Evening review']);
        setActiveTab('challenges');
        alert(`Enrolled into "${title}"! View it under active sprints.`);
      };

      const circumference = 314.159;
      const strokeDashoffset = circumference - (successRate / 100) * circumference;

      // If user is not logged in, show Stitch Auth / Login view with strict DB check
      if (!currentUser) {
        const handleAuthSubmit = (e) => {
          e.preventDefault();
          setAuthError('');
          setAuthSuccess('');

          const cleanEmail = authEmail.trim().toLowerCase();
          const cleanPwd = authPassword.trim();

          if (!cleanEmail || !cleanPwd) {
            setAuthError('Please enter both email and password.');
            return;
          }

          // Pre-seeded default users list
          const defaultUsers = [
            { name: 'Karthik V.', email: 'alex@example.com', password: 'password123', streak: 12 }
          ];

          const stored = localStorage.getItem('daybyday_registered_users');
          const registeredUsers = stored ? JSON.parse(stored) : defaultUsers;
          if (!stored) {
            localStorage.setItem('daybyday_registered_users', JSON.stringify(defaultUsers));
          }

          if (authMode === 'signup') {
            if (!authName.trim()) {
              setAuthError('Please enter your full name to create an account.');
              return;
            }
            const exists = registeredUsers.find(u => u.email.toLowerCase() === cleanEmail);
            if (exists) {
              setAuthError('An account with this email already exists in the database. Please sign in.');
              return;
            }
            const newUser = {
              name: authName.trim(),
              email: cleanEmail,
              password: cleanPwd,
              streak: 12
            };
            registeredUsers.push(newUser);
            localStorage.setItem('daybyday_registered_users', JSON.stringify(registeredUsers));
            localStorage.setItem('daybyday_auth_user', JSON.stringify(newUser));
            sound.playMilestone();
            setAuthSuccess('Account created successfully! Welcome to DayByDay.');
            setTimeout(() => {
              setCurrentUser(newUser);
            }, 300);
          } else {
            // Strict Login check
            const user = registeredUsers.find(u => u.email.toLowerCase() === cleanEmail);
            if (!user) {
              setAuthError('Account not found in database! Please create an account first by clicking "Sign up for free".');
              return;
            }
            if (user.password !== cleanPwd) {
              setAuthError('Incorrect password. Please enter the correct password.');
              return;
            }
            localStorage.setItem('daybyday_auth_user', JSON.stringify(user));
            sound.playMilestone();
            setCurrentUser(user);
          }
        };

        return (
          <div className="min-h-screen bg-[#0b1326] text-[#dae2fd] flex flex-col justify-between items-center p-4 sm:p-6 lg:p-8 relative overflow-hidden font-sans select-none">
            {/* Background ambient light */}
            <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[400px] bg-gradient-to-b from-[#6366F1]/15 to-transparent blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-20 -left-20 w-96 h-96 bg-[#4edea3]/5 rounded-full blur-3xl pointer-events-none"></div>

            {/* Top Brand & Notification Pill */}
            <div className="w-full max-w-4xl flex flex-col items-center pt-2 sm:pt-4 z-10 space-y-4">
              <div className="flex items-center gap-2.5">
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-[#6366F1] to-[#8083ff] p-[1.5px] shadow-[0_0_16px_rgba(99,102,241,0.5)]">
                  <div className="w-full h-full bg-[#0b1326] rounded-xl flex items-center justify-center">
                    <span className="text-[#c0c1ff] text-sm font-bold">⚡</span>
                  </div>
                </div>
                <span className="font-display font-extrabold text-base tracking-tight text-white">
                  DayByDay Tracker
                </span>
              </div>

              {/* Notification Pill */}
              <div className="inline-flex items-center gap-2.5 px-4 py-1.5 rounded-full bg-[#131b2e] border border-white/10 text-xs font-display shadow-lg shadow-black/40">
                <span className="w-2 h-2 rounded-full bg-[#4edea3] animate-pulse"></span>
                <span className="text-amber-400">🔥</span>
                <span className="text-white font-medium">12-day streak waiting for you</span>
                <span className="text-white/20">|</span>
                <span className="text-[10px] font-bold uppercase tracking-wider text-[#908fa0]">
                  DAY 13/30 UNLOCKS TODAY
                </span>
              </div>
            </div>

            {/* Split Card */}
            <div className="w-full max-w-4xl my-6 rounded-3xl bg-[#0f172a]/90 backdrop-blur-xl border border-white/10 shadow-[0_24px_60px_-12px_rgba(0,0,0,0.7)] grid grid-cols-1 md:grid-cols-2 overflow-hidden z-10">

                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-display font-bold text-lg text-white">Day {dayModal.dayNumber} Reflection</h3>
                  <button onClick={() => setDayModal(null)} className="text-on-surface-variant hover:text-white">✕</button>
                </div>

                <div className="space-y-4">
                  <div>
                    <label className="block text-xs font-display font-semibold text-on-surface-variant uppercase mb-1">Status</label>
                    <div className="grid grid-cols-3 gap-2">
                      {['completed', 'missed', 'pending'].map(st => (
                        <button
                          key={st}
                          type="button"
                          onClick={() => setDayModal({ ...dayModal, status: st })}
                          className={`py-2 rounded-xl text-xs font-display font-bold uppercase border transition-all ${
                            dayModal.status === st ? 'bg-primary/25 border-primary text-white shadow-glow-primary' : 'bg-surface-container text-on-surface-variant'
                          }`}
                        >
                          {st}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-display font-semibold text-on-surface-variant uppercase mb-1">Reflection Note</label>
                    <textarea
                      rows="3"
                      value={dayModal.note || ''}
                      onChange={(e) => setDayModal({ ...dayModal, note: e.target.value })}
                      placeholder="What breakthrough did you achieve today?"
                      className="w-full px-3 py-2 rounded-xl bg-surface-container border border-white/10 text-xs text-white focus:outline-none focus:border-brand-indigo"
                    ></textarea>
                  </div>

                  <button
                    onClick={() => handleSaveDayNote(dayModal.dayNumber, dayModal.status, dayModal.note, dayModal.mood)}
                    className="w-full py-2.5 rounded-xl font-display font-bold text-sm text-white bg-brand-indigo hover:bg-brand-indigo-dark shadow-glow-primary"
                  >
                    Save Reflection
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CREATE CHALLENGE MODAL */}
          {isNewModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
              <div className="w-full max-w-lg rounded-3xl glass-card border border-white/10 p-6 sm:p-8 shadow-modal-rim relative">
                <div className="flex items-center justify-between mb-4">
                  <h3 className="font-display font-bold text-xl text-white">Create 30-Day Sprint</h3>
                  <button onClick={() => setIsNewModalOpen(false)} className="text-on-surface-variant hover:text-white">✕</button>
                </div>

                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const title = e.target.title.value;
                    const cat = e.target.category.value;
                    const desc = e.target.desc.value;
                    const habits = e.target.habits.value.split(',').map(s => s.trim()).filter(Boolean);
                    handleCreateChallenge(title, cat, desc, habits);
                  }}
                  className="space-y-4"
                >
                  <div>
                    <label className="block text-xs font-display font-semibold text-on-surface-variant uppercase mb-1">Title</label>
                    <input name="title" required placeholder="e.g. 30 Days of High Performance Coding" className="w-full px-4 py-2 rounded-xl bg-surface-container border border-white/10 text-sm text-white focus:outline-none focus:border-brand-indigo" />
                  </div>
                  <div>
                    <label className="block text-xs font-display font-semibold text-on-surface-variant uppercase mb-1">Category</label>
                    <select name="category" className="w-full px-4 py-2 rounded-xl bg-surface-container border border-white/10 text-sm text-white focus:outline-none focus:border-brand-indigo">
                      <option>Fitness & Health</option>
                      <option>Coding & Dev</option>
                      <option>Mind & Reading</option>
                      <option>Creative Writing</option>
                      <option>Deep Work</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-display font-semibold text-on-surface-variant uppercase mb-1">Intention / Description</label>
                    <textarea name="desc" rows="2" placeholder="Why does this sprint matter to you?" className="w-full px-4 py-2 rounded-xl bg-surface-container border border-white/10 text-xs text-white focus:outline-none focus:border-brand-indigo"></textarea>
                  </div>
                  <div>
                    <label className="block text-xs font-display font-semibold text-on-surface-variant uppercase mb-1">Habits Checklist (Comma separated)</label>
                    <input name="habits" defaultValue="45-min workout, 1 problem solved, 3L water" className="w-full px-4 py-2 rounded-xl bg-surface-container border border-white/10 text-xs text-white focus:outline-none focus:border-brand-indigo" />
                  </div>
                  <div className="flex justify-end gap-3 pt-2">
                    <button type="button" onClick={() => setIsNewModalOpen(false)} className="px-4 py-2 text-sm text-on-surface-variant">Cancel</button>
                    <button type="submit" className="px-5 py-2.5 rounded-xl font-display font-bold text-sm text-white bg-gradient-to-r from-brand-indigo to-brand-purple shadow-glow-primary">
                      Launch Sprint
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CELEBRATION MODAL */}
          {celebrationData && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl glass-card border border-brand-indigo/30 p-8 shadow-modal-rim text-center relative">
                <div className="w-16 h-16 mx-auto mb-3 rounded-2xl bg-gradient-to-tr from-amber-400 to-brand-indigo p-[2px] flex items-center justify-center text-3xl">
                  🏆
                </div>
                <h3 className="font-display font-extrabold text-2xl text-white mb-2">
                  Day {celebrationData.milestone} Milestone Unlocked!
                </h3>
                <p className="text-sm text-on-surface-variant mb-6">
                  You broke through inertia and built real momentum! Keep the flame burning.
                </p>
                <button
                  onClick={() => setCelebrationData(null)}
                  className="w-full py-3 rounded-xl font-display font-bold text-sm text-white bg-gradient-to-r from-brand-indigo to-brand-purple shadow-glow-primary"
                >
                  Continue Crushing It
                </button>
              </div>
            </div>
          )}

          {/* SHARE CARD MODAL */}
          {isShareModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-md">
              <div className="w-full max-w-md rounded-3xl glass-card border border-white/10 p-6 shadow-modal-rim relative text-center">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-display font-bold text-lg text-white">Share Your Streak</h3>
                  <button onClick={() => setIsShareModalOpen(false)} className="text-on-surface-variant hover:text-white">✕</button>
                </div>
                <div className="p-6 rounded-2xl bg-surface-lowest border border-white/10 mb-4 text-left space-y-2">
                  <span className="text-xs text-primary-tint font-bold">⚡ DAYBYDAY — 30 DAYS SPRINT</span>
                  <h4 className="text-lg font-bold text-white">{activeChallenge.title}</h4>
                  <div className="pt-2 flex justify-between text-xs text-on-surface-variant border-t border-white/10">
                    <span>Streak: <strong className="text-amber-300 font-bold">{activeChallenge.streak || 0} Days</strong></span>
                    <span>Completed: <strong className="text-emerald-400 font-bold">{completedCount}/30 Days</strong></span>
                    <span>Progress: <strong className="text-white font-bold">{successRate}%</strong></span>
                  </div>
                </div>
                <button
                  onClick={() => {
                    navigator.clipboard.writeText(`I'm on Day ${activeChallenge.streak || 0} of my 30-Day sprint on "${activeChallenge.title}" with DayByDay! 🔥`);
                    alert('Streak status copied to clipboard!');
                    setIsShareModalOpen(false);
                  }}
                  className="w-full py-2.5 rounded-xl bg-brand-indigo text-white font-display font-bold text-sm shadow-glow-primary"
                >
                  Copy Streak Summary
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
